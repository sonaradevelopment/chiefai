<script>
  // Tell the page how big the ad really is, so the page can crop to it
  (function () {
    var tries = 0;
    function check() {
      var el = document.querySelector('iframe, img, object, embed, ins, a');
      if (el) {
        var r = el.getBoundingClientRect();
        if (r.width > 20 && r.height > 10) {
          parent.postMessage({ chiefAd: 'ready', w: Math.round(r.width), h: Math.round(r.height) }, '*');
          return;
        }
      }
      if (++tries < 40) setTimeout(check, 250);
    }
    check();
  })();
</script>
